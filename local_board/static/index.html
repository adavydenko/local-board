<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Local Board</title>
  <style>
    :root{color-scheme:dark;--bg:#090b10;--side:#0d1016;--panel:#121620;--raised:#171c27;--line:#262d3b;--text:#eef1f7;--muted:#8e98aa;--accent:#8b7cf6;--accent2:#6255d9;--danger:#fb7185;--warn:#fbbf24;--ok:#4ade80}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 55% -20%,#1a1b35 0,transparent 38%),var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}.sidebar{background:rgba(13,16,22,.92);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;align-items:center;font-size:17px;font-weight:750;padding:0 10px 25px}.logo{display:grid;place-items:center;width:27px;height:27px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#6355d8);box-shadow:0 0 25px #8b7cf655}.nav{display:flex;align-items:center;gap:11px;border:0;color:var(--muted);background:transparent;padding:10px 11px;border-radius:8px;text-align:left;width:100%;margin:2px 0}.nav:hover,.nav.active{background:#1a1f2a;color:var(--text)}.nav span{width:18px;text-align:center}.identity{margin-top:auto;padding:12px;background:#11151e;border:1px solid var(--line);border-radius:9px}.identity strong{display:block}.identity small{color:var(--muted)}.main{padding:26px 30px;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:20px}.title h1{font-size:22px;margin:0 0 5px}.muted{color:var(--muted)}.actions{display:flex;gap:8px}.btn{border:1px solid transparent;border-radius:8px;padding:8px 12px;background:var(--accent);color:white;font-weight:650}.btn:hover{background:var(--accent2)}.btn.secondary{background:#181d28;border-color:var(--line);color:var(--text)}.btn.danger{background:#351923;color:#fda4af}.btn.small{padding:5px 8px;font-size:12px}.select,input,textarea{background:#0d1119;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 10px;outline:none}.select:focus,input:focus,textarea:focus{border-color:var(--accent)}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px}.toolbar .select{min-width:170px}.stats{display:grid;grid-template-columns:repeat(4,minmax(120px,180px));gap:10px;margin-bottom:18px}.stat{background:linear-gradient(145deg,#141923,#10141c);border:1px solid var(--line);border-radius:10px;padding:13px 15px}.stat b{font-size:21px;display:block;margin-bottom:3px}.stat span{font-size:12px;color:var(--muted)}.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:11px;overflow:auto;padding-bottom:15px;min-height:540px}.column{background:#0d1118;border:1px solid #202633;border-radius:11px;padding:9px}.column-head{display:flex;align-items:center;justify-content:space-between;text-transform:capitalize;font-size:12px;font-weight:700;color:#b7becc;padding:5px 5px 9px}.count{background:#252b38;color:var(--muted);border-radius:10px;padding:1px 7px}.card{background:linear-gradient(145deg,#171c27,#131821);border:1px solid #29303e;border-radius:9px;padding:12px;margin:0 0 8px;transition:.15s;cursor:pointer}.card:hover{transform:translateY(-1px);border-color:#4c456f;box-shadow:0 8px 24px #0005}.card-title{font-weight:650;line-height:1.4;margin-bottom:11px}.meta{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px}.badges{display:flex;gap:5px;margin-bottom:9px;flex-wrap:wrap}.badge{font-size:10px;padding:2px 6px;border-radius:5px;background:#252b38;color:#c7cedb}.badge.bug{background:#3a1b25;color:#fda4af}.badge.feature{background:#182d35;color:#67e8f9}.priority-urgent{color:var(--danger)}.priority-high{color:var(--warn)}.empty{color:#5f6878;text-align:center;padding:42px 5px;font-size:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}.table-row{display:grid;grid-template-columns:120px 1fr 140px 120px;gap:15px;padding:13px 16px;border-bottom:1px solid var(--line);align-items:center}.table-row:last-child{border:0}.activity-row{display:grid;grid-template-columns:150px 150px 1fr 190px;gap:15px;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--muted)}.hidden{display:none!important}.login{position:fixed;inset:0;background:radial-gradient(circle at center,#171a2d,#07090ddd 50%);display:grid;place-items:center;z-index:20}.login-card{width:min(400px,calc(100vw - 30px));padding:29px;background:#121620;border:1px solid #2b3241;border-radius:14px;box-shadow:0 30px 80px #000}.login-card h2{margin:0 0 8px}.login-card input{width:100%;margin:14px 0 10px}.error{color:#fda4af;margin-top:9px}.dialog{border:1px solid #30384a;background:#121620;color:var(--text);border-radius:14px;width:min(580px,calc(100vw - 28px));padding:0;box-shadow:0 30px 100px #000}.dialog.wide{width:min(820px,calc(100vw - 28px))}.dialog::backdrop{background:#05060acc;backdrop-filter:blur(3px)}.dialog-body{padding:22px}.dialog h2{margin:0 0 18px}.field{display:block;margin:11px 0;color:#b8c0cf;font-size:12px}.field input,.field textarea,.field select{width:100%;margin-top:6px}.field textarea{min-height:110px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.detail-head{display:flex;justify-content:space-between;gap:15px}.detail-head h2{margin:4px 0}.detail-id{color:var(--muted);font-size:12px}.markdown{line-height:1.65;color:#d9deea;padding:12px 0;white-space:normal}.markdown code{background:#262c38;padding:2px 5px;border-radius:4px}.section{border-top:1px solid var(--line);padding:16px 0}.section h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 11px}.check{display:flex;align-items:center;gap:9px;padding:6px 0}.check.done span{text-decoration:line-through;color:var(--muted)}.comment{padding:10px 0;border-bottom:1px solid #232936}.comment strong{font-size:12px}.comment p{margin:5px 0;color:#ccd2df}.inline-form{display:flex;gap:7px}.inline-form input{flex:1}.transition-list{display:flex;gap:7px;flex-wrap:wrap}.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:22px}.side-fields{background:#0e121a;border-radius:9px;padding:12px;height:max-content}.side-fields .field{margin:0 0 12px}.link{color:#a99df9}.blocked{color:#fda4af}.toast{position:fixed;right:22px;bottom:22px;background:#202635;border:1px solid #394256;border-radius:9px;padding:11px 15px;box-shadow:0 12px 40px #000;z-index:30}@media(max-width:850px){.app{grid-template-columns:64px 1fr}.sidebar{padding:18px 8px}.brand{padding:0 9px 22px}.brand-text,.nav label,.identity{display:none}.nav{justify-content:center}.main{padding:20px 14px}.detail-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.table-row,.activity-row{grid-template-columns:1fr 1fr}.hide-mobile{display:none}}
  </style>
</head>
<body>
<div class="login" id="login"><form class="login-card" id="loginForm"><div class="brand"><span class="logo">◆</span><span>Local Board</span></div><h2>Connect to this repository</h2><p class="muted">Enter an actor token created with <code>local-board actor</code>. The token stays in this browser.</p><input id="tokenInput" type="password" placeholder="Bearer token" required><button class="btn" style="width:100%">Open board</button><div class="error" id="loginError"></div></form></div>
<div class="app">
  <aside class="sidebar"><div class="brand"><span class="logo">◆</span><span class="brand-text">Local Board</span></div><button class="nav active" data-view="board"><span>▦</span><label>Issues</label></button><button class="nav" data-view="projects"><span>◇</span><label>Projects</label></button><button class="nav" data-view="activity"><span>⌁</span><label>Activity</label></button><div class="identity"><strong id="actorName">—</strong><small id="actorKind">Not connected</small></div></aside>
  <main class="main"><header class="topbar"><div class="title"><h1 id="pageTitle">Issues</h1><div class="muted" id="subtitle">Repository work shared by humans and agents</div></div><div class="actions"><button class="btn secondary" id="refreshBtn">↻ Refresh</button><button class="btn" id="newIssueBtn">＋ New issue</button></div></header>
    <section id="boardView"><div class="toolbar"><select class="select" id="projectSelect"></select><select class="select" id="typeFilter"><option value="">All issue types</option></select><span class="muted" id="configBadge"></span></div><div class="stats" id="stats"></div><div class="board" id="board"></div></section>
    <section id="projectsView" class="hidden"><div class="panel" id="projectsPanel"></div></section>
    <section id="activityView" class="hidden"><div class="panel" id="activityPanel"></div></section>
  </main>
</div>
<dialog class="dialog" id="issueDialog"><form class="dialog-body" id="issueForm"><h2>Create issue</h2><label class="field">Title<input id="issueTitle" required></label><label class="field">Markdown description<textarea id="issueDescription" placeholder="Context, acceptance criteria, and constraints"></textarea></label><div class="grid2"><label class="field">Type<select id="issueType"></select></label><label class="field">Priority<select id="issuePriority"><option>none</option><option>low</option><option selected>medium</option><option>high</option><option>urgent</option></select></label></div><div class="dialog-actions"><button type="button" class="btn secondary" data-close="issueDialog">Cancel</button><button class="btn">Create issue</button></div><div class="error" id="issueError"></div></form></dialog>
<dialog class="dialog wide" id="detailDialog"><div class="dialog-body" id="detailBody"></div></dialog>
<div class="toast hidden" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let token=localStorage.localBoardToken||'',data={},currentIssue=null,currentView='board';const auth=()=>({'Authorization':'Bearer '+token,'Content-Type':'application/json'});const esc=v=>{const d=document.createElement('div');d.textContent=v??'';return d.innerHTML};
async function api(path,options={}){const response=await fetch(path,{...options,headers:{...auth(),...(options.headers||{})}});let body={};if(response.status!==204){try{body=await response.json()}catch{}}if(!response.ok)throw Error(body.error?.message||body.error||`HTTP ${response.status}`);return body}
function notify(message){toast.textContent=message;toast.classList.remove('hidden');setTimeout(()=>toast.classList.add('hidden'),2200)}
async function load(project){const suffix=project?'?project='+encodeURIComponent(project):'';data=await api('/api/dashboard'+suffix);login.classList.add('hidden');actorName.textContent=data.me.name;actorKind.textContent=data.me.kind;render()}
function states(){if(!data.project)return[];const selected=typeFilter.value;const workflows=data.project.workflows.filter(w=>!selected||w.issue_type===selected);const seen=[];workflows.forEach(w=>w.states.forEach(s=>{if(!seen.includes(s))seen.push(s)}));return seen}
function render(){projectSelect.innerHTML=data.projects.map(p=>`<option value="${esc(p.key)}" ${data.project?.id===p.id?'selected':''}>${esc(p.name)} · ${esc(p.key)}</option>`).join('');const types=data.project?.workflows.map(w=>w.issue_type)||[];const old=typeFilter.value;typeFilter.innerHTML='<option value="">All issue types</option>'+types.map(t=>`<option ${old===t?'selected':''}>${esc(t)}</option>`).join('');configBadge.textContent=data.project?.config_digest?'◆ managed by project.toml':'Manual project';renderStats();renderBoard();renderProjects();renderActivity()}
function visibleIssues(){return data.issues.filter(i=>!typeFilter.value||i.type===typeFilter.value)}
function renderStats(){const issues=visibleIssues();stats.innerHTML=`<div class=stat><b>${issues.length}</b><span>Total issues</span></div><div class=stat><b>${issues.filter(i=>i.status==='in_progress').length}</b><span>In progress</span></div><div class=stat><b>${issues.filter(i=>i.status==='in_review').length}</b><span>In review</span></div><div class=stat><b>${issues.filter(i=>i.priority==='urgent'||i.priority==='high').length}</b><span>High priority</span></div>`}
function renderBoard(){board.innerHTML=states().map(state=>{const issues=visibleIssues().filter(i=>i.status===state);return `<div class=column><div class=column-head><span>${esc(state.replaceAll('_',' '))}</span><span class=count>${issues.length}</span></div>${issues.map(card).join('')||'<div class=empty>No issues</div>'}</div>`}).join('')||'<div class=empty>Create or select a project to start.</div>';$$('.card').forEach(el=>el.onclick=()=>openDetail(el.dataset.issue))}
function card(i){return `<article class=card data-issue="${esc(i.identifier)}"><div class=badges><span class="badge ${esc(i.type)}">${esc(i.type)}</span>${i.claim_expires_at?'<span class=badge>claimed</span>':''}</div><div class=card-title>${esc(i.title)}</div><div class=meta><span>${esc(i.identifier)} · r${i.revision}</span><span class="priority-${esc(i.priority)}">${esc(i.priority)}</span></div></article>`}
function renderProjects(){projectsPanel.innerHTML=data.projects.map(p=>`<div class=table-row><strong>${esc(p.key)}</strong><div><b>${esc(p.name)}</b><div class=muted>${esc(p.description||'No description')}</div></div><span>${p.managed_by==='config'?'project.toml':'manual'}</span><button class="btn secondary small" onclick="selectProject('${esc(p.key)}')">Open</button></div>`).join('')||'<div class=empty>No projects</div>'}
function renderActivity(){activityPanel.innerHTML=data.activity.map(a=>`<div class=activity-row><b>${esc(a.actor||'system')}</b><span>${esc(a.entity_type)} #${a.entity_id}</span><span>${esc(a.action)}</span><time>${new Date(a.created_at).toLocaleString()}</time></div>`).join('')||'<div class=empty>No activity</div>'}
function markdown(value){let out=esc(value||'No description');out=out.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>').replace(/^- (.+)$/gm,'• $1').replace(/\n/g,'<br>');return out}
async function openDetail(ref){try{currentIssue=await api('/api/issues/'+encodeURIComponent(ref));renderDetail();detailDialog.showModal()}catch(e){notify(e.message)}}
function actorOptions(selected){return '<option value="">Unassigned</option>'+data.actors.map(a=>`<option value=${a.id} ${selected===a.id?'selected':''}>${esc(a.name)} · ${a.kind}</option>`).join('')}
function renderDetail(){const i=currentIssue;detailBody.innerHTML=`<div class=detail-head><div><div class=detail-id>${esc(i.identifier)} · revision ${i.revision}</div><h2>${esc(i.title)}</h2><div class=badges><span class="badge ${esc(i.type)}">${esc(i.type)}</span><span class="badge priority-${esc(i.priority)}">${esc(i.priority)}</span>${i.blocked?'<span class="badge blocked">blocked</span>':''}</div></div><button class="btn secondary" onclick="detailDialog.close()">×</button></div><div class=detail-grid><div><div class=markdown>${markdown(i.description)}</div><div class=section><h3>Workflow</h3><div class=transition-list>${i.available_transitions.map(s=>`<button class="btn small" onclick="transition('${esc(s)}')">${esc(s.replaceAll('_',' '))}</button>`).join('')||'<span class=muted>No available transitions</span>'}</div></div><div class=section><h3>Checklist</h3>${i.checklist.map(c=>`<label class="check ${c.completed?'done':''}"><input type=checkbox ${c.completed?'checked':''} onchange="toggleCheck(${c.id},this.checked)"><span>${esc(c.text)}</span></label>`).join('')}<form class=inline-form onsubmit="addChecklist(event)"><input id=newCheck placeholder="Add checklist item"><button class="btn small">Add</button></form></div><div class=section><h3>Comments</h3>${i.comments.map(c=>`<div class=comment><strong>${esc(c.author)}</strong><p>${markdown(c.body)}</p></div>`).join('')||'<div class=muted>No comments yet</div>'}<form class=inline-form onsubmit="addComment(event)"><input id=newComment placeholder="Write a progress update"><button class="btn small">Comment</button></form></div><div class=section><h3>Dependencies & links</h3>${i.dependencies.map(d=>`<div>${d.completed?'✓':'○'} <span class=link>${esc(d.identifier)}</span> ${esc(d.title)}</div>`).join('')||'<div class=muted>No dependencies</div>'}${i.git_links.map(l=>`<div>⌁ ${esc(l.kind)} · ${esc(l.ref)}</div>`).join('')}</div></div><aside class=side-fields><label class=field>Status<input value="${esc(i.status)}" disabled></label><label class=field>Assignee<select id=detailAssignee onchange="updateAssignment()">${actorOptions(i.assignee_id)}</select></label><label class=field>Reviewer<select id=detailReviewer onchange="updateAssignment()">${actorOptions(i.reviewer_id)}</select></label><label class=field>Priority<select id=detailPriority onchange="updateAssignment()">${['none','low','medium','high','urgent'].map(p=>`<option ${p===i.priority?'selected':''}>${p}</option>`).join('')}</select></label>${i.assignee_id===data.me.id?`<button class="btn secondary" style="width:100%" onclick="releaseIssue()">Release issue</button>`:`<button class=btn style="width:100%" onclick="claimIssue()">Claim issue</button>`}</aside></div>`}
async function refreshDetail(){currentIssue=await api('/api/issues/'+encodeURIComponent(currentIssue.identifier));renderDetail();await load(data.project.key)}
async function transition(status){try{currentIssue=await api(`/api/issues/${currentIssue.identifier}/transition`,{method:'POST',body:JSON.stringify({status,expected_revision:currentIssue.revision})});notify('Issue moved to '+status);await refreshDetail()}catch(e){notify(e.message);await openDetail(currentIssue.identifier)}}
async function claimIssue(){try{currentIssue=await api(`/api/issues/${currentIssue.identifier}/claim`,{method:'POST',body:JSON.stringify({expected_revision:currentIssue.revision})});notify('Issue claimed');await refreshDetail()}catch(e){notify(e.message)}}
async function releaseIssue(){try{currentIssue=await api(`/api/issues/${currentIssue.identifier}/release`,{method:'POST',body:JSON.stringify({expected_revision:currentIssue.revision})});notify('Issue released');await refreshDetail()}catch(e){notify(e.message)}}
async function updateAssignment(){try{const body={expected_revision:currentIssue.revision,assignee_id:detailAssignee.value?+detailAssignee.value:null,reviewer_id:detailReviewer.value?+detailReviewer.value:null,priority:detailPriority.value};currentIssue=await api('/api/issues/'+currentIssue.identifier,{method:'PATCH',body:JSON.stringify(body)});await refreshDetail()}catch(e){notify(e.message)}}
async function toggleCheck(id,completed){try{await api('/api/checklist/'+id,{method:'PATCH',body:JSON.stringify({completed})});await refreshDetail()}catch(e){notify(e.message)}}
async function addChecklist(e){e.preventDefault();if(!newCheck.value)return;try{await api(`/api/issues/${currentIssue.identifier}/checklist`,{method:'POST',body:JSON.stringify({text:newCheck.value})});await refreshDetail()}catch(x){notify(x.message)}}
async function addComment(e){e.preventDefault();if(!newComment.value)return;try{await api(`/api/issues/${currentIssue.identifier}/comments`,{method:'POST',body:JSON.stringify({body:newComment.value})});await refreshDetail()}catch(x){notify(x.message)}}
function setView(view){currentView=view;$$('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===view));['board','projects','activity'].forEach(v=>$('#'+v+'View').classList.toggle('hidden',v!==view));pageTitle.textContent={board:'Issues',projects:'Projects',activity:'Activity'}[view];newIssueBtn.classList.toggle('hidden',view!=='board')}
async function selectProject(key){setView('board');await load(key)}
loginForm.onsubmit=async e=>{e.preventDefault();token=tokenInput.value;try{await load();localStorage.localBoardToken=token}catch(x){loginError.textContent=x.message}};refreshBtn.onclick=()=>load(data.project?.key).catch(e=>notify(e.message));projectSelect.onchange=()=>load(projectSelect.value);typeFilter.onchange=()=>{renderStats();renderBoard()};newIssueBtn.onclick=()=>issueDialog.showModal();issueForm.onsubmit=async e=>{e.preventDefault();try{await api('/api/issues',{method:'POST',body:JSON.stringify({project:data.project.key,title:issueTitle.value,description:issueDescription.value,issue_type:issueType.value,priority:issuePriority.value})});issueDialog.close();issueForm.reset();notify('Issue created');await load(data.project.key)}catch(x){issueError.textContent=x.message}};$$('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).close());$$('.nav').forEach(n=>n.onclick=()=>setView(n.dataset.view));if(token)load().catch(()=>{localStorage.removeItem('localBoardToken');login.classList.remove('hidden')});
</script>
</body></html>
