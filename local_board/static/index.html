<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Board</title>
<style>
:root{color-scheme:dark;--bg:#0b0d12;--panel:#12151d;--line:#252a36;--muted:#8c93a5;--text:#eef0f6;--accent:#8b7cf6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui}button,input,select,textarea{font:inherit}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:24px 16px;background:#0e1016}.brand{font-size:18px;font-weight:750;margin:0 8px 28px}.brand b{color:var(--accent)}.nav{color:var(--muted);padding:9px 10px;border-radius:7px;margin:2px 0}.nav.active{color:var(--text);background:#1a1d27}.main{padding:30px 36px;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between}.top h1{font-size:22px}.btn{border:0;background:var(--accent);color:white;border-radius:7px;padding:9px 13px;font-weight:650;cursor:pointer}.btn.ghost{background:#1b1e28;color:var(--text)}.stats{display:flex;gap:12px;margin:22px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;min-width:140px}.stat strong{font-size:23px;display:block}.stat span{color:var(--muted);font-size:12px}.board{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:12px;overflow:auto;padding-bottom:20px}.column{background:#0e1117;border:1px solid var(--line);border-radius:10px;min-height:440px;padding:10px}.column h3{text-transform:capitalize;font-size:12px;color:var(--muted);letter-spacing:.03em;padding:0 5px}.count{float:right;background:#252936;border-radius:8px;padding:1px 6px}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 0}.title{font-weight:600;margin-bottom:12px;line-height:1.4}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.priority-urgent{color:#fb7185}.priority-high{color:#fbbf24}.empty{color:var(--muted);text-align:center;padding:50px 10px}.login{position:fixed;inset:0;background:rgba(5,6,10,.94);display:grid;place-items:center;z-index:3}.login form{width:390px;padding:30px;background:var(--panel);border:1px solid var(--line);border-radius:12px}.login h2{margin-top:0}.login input,.dialog input,.dialog textarea,.dialog select{width:100%;background:#0c0e14;border:1px solid var(--line);color:var(--text);padding:10px;border-radius:7px;margin:6px 0 13px}.hint{color:var(--muted);line-height:1.5}.dialog{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;width:480px}.dialog::backdrop{background:rgba(0,0,0,.7)}.dialog form{padding:10px}.dialog textarea{height:100px;resize:vertical}.error{color:#fb7185}.activity{margin-top:16px;border-top:1px solid var(--line);padding-top:16px;color:var(--muted)}
</style></head><body>
<div class="login" id="login"><form id="loginForm"><h2>Connect to Local Board</h2><p class="hint">Enter a token created with <code>local-board actor NAME</code>. It stays in this browser only.</p><input id="token" type="password" placeholder="Bearer token" required><button class="btn">Open board</button><p class="error" id="loginError"></p></form></div>
<div class="shell"><aside class="side"><div class="brand"><b>◆</b> Local Board</div><div class="nav active">▦ Issues</div><div class="nav">◇ Projects</div><div class="nav">△ Milestones</div><div class="nav">⌁ Activity</div><div class="nav">⚙ Workflows</div></aside><main class="main"><header class="top"><div><h1>Repository issues</h1><span class="hint" id="identity">Local-first planning for humans and agents</span></div><button class="btn" onclick="openIssue()">＋ New issue</button></header><section class="stats" id="stats"></section><section class="board" id="board"></section><section class="activity" id="activity"></section></main></div>
<dialog class="dialog" id="issueDialog"><form id="issueForm"><h2>Create issue</h2><label>Project<select id="project" required></select></label><label>Title<input id="title" required></label><label>Markdown description<textarea id="description"></textarea></label><label>Type<select id="type"><option>task</option><option>bug</option><option>feature</option><option>chore</option><option>epic</option></select></label><label>Priority<select id="priority"><option>none</option><option>low</option><option selected>medium</option><option>high</option><option>urgent</option></select></label><button class="btn">Create</button> <button type="button" class="btn ghost" onclick="issueDialog.close()">Cancel</button><p class="error" id="issueError"></p></form></dialog>
<script>
const states=['backlog','todo','in_progress','in_review','done','cancelled'];let token=localStorage.localBoardToken||'',data={};const auth=()=>({'Authorization':'Bearer '+token,'Content-Type':'application/json'});
async function load(){let r=await fetch('/api/dashboard',{headers:auth()});if(!r.ok)throw Error((await r.json()).error);data=await r.json();login.style.display='none';render()}
function render(){stats.innerHTML=`<div class=stat><strong>${data.issues.length}</strong><span>Total issues</span></div><div class=stat><strong>${data.issues.filter(x=>x.status==='in_progress').length}</strong><span>In progress</span></div><div class=stat><strong>${data.projects.length}</strong><span>Projects</span></div><div class=stat><strong>${data.actors.length}</strong><span>Collaborators</span></div>`;board.innerHTML=states.map(s=>{let items=data.issues.filter(i=>i.status===s);return `<div class=column><h3>${s.replace('_',' ')} <span class=count>${items.length}</span></h3>${items.map(i=>`<article class=card><div class=title>${escapeHtml(i.title)}</div><div class=meta><span>${i.identifier} · ${i.type}</span><span class=priority-${i.priority}>${i.priority}</span></div></article>`).join('')||'<div class=empty>No issues</div>'}</div>`}).join('');project.innerHTML=data.projects.map(p=>`<option value=${p.id}>${escapeHtml(p.name)} (${p.key})</option>`).join('');activity.innerHTML='<b>Recent activity</b> · '+data.activity.slice(0,5).map(a=>`${escapeHtml(a.actor||'system')} ${a.action}`).join(' · ')}
function escapeHtml(v){let d=document.createElement('div');d.textContent=v;return d.innerHTML}function openIssue(){if(!data.projects.length)return alert('Create a project through MCP first.');issueDialog.showModal()}
loginForm.onsubmit=async e=>{e.preventDefault();token=document.querySelector('#token').value;try{await load();localStorage.localBoardToken=token}catch(x){loginError.textContent=x.message}};
issueForm.onsubmit=async e=>{e.preventDefault();let body={project_id:+project.value,title:title.value,description:description.value,issue_type:type.value,priority:priority.value};let r=await fetch('/api/issues',{method:'POST',headers:auth(),body:JSON.stringify(body)});if(!r.ok){issueError.textContent=(await r.json()).error;return}issueDialog.close();issueForm.reset();await load()};if(token)load().catch(()=>localStorage.removeItem('localBoardToken'));
</script></body></html>
