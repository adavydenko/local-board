interface:
  display_name: "Local Board"
  short_description: "Plan and coordinate repository work through Local Board MCP"
  default_prompt: "Use $local-board to plan work into milestones and issues, then discover, claim, comment on, review, and complete repository issues through the configured Local Board MCP server."
dependencies:
  tools:
    - type: "mcp"
      value: "local-board"
      description: "Repository-local issue board and coordination server"
      transport: "streamable_http"
      url: "http://127.0.0.1:8765/mcp"
