schema_version = 2

[project]
prefix = "LB"
name = "Local Board"
description = ""

[defaults]
priority = "medium"

[agent_policy]
require_assignee_before_start = true

# Status names are yours to change; categories are the contract.
# Transitions are free: any status can move to any other status.
[[statuses]]
name = "Backlog"
category = "backlog"

[[statuses]]
name = "Todo"
category = "unstarted"

[[statuses]]
name = "In Progress"
category = "started"

[[statuses]]
name = "In Review"
category = "started"

[[statuses]]
name = "Done"
category = "completed"

[[statuses]]
name = "Canceled"
category = "canceled"

# Starter labels: working documentation of the label-over-issue-type model.
# Rename, recolor, or remove them freely.
[[labels]]
key = "bug"
name = "Bug"
color = "#ef4444"

[[labels]]
key = "feature"
name = "Feature"
color = "#3b82f6"

[[labels]]
key = "chore"
name = "Chore"
color = "#64748b"

[[labels]]
key = "review_required"
name = "Review required"
color = "#f59e0b"

[[labels]]
key = "reviewed"
name = "Reviewed"
color = "#22c55e"
