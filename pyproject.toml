[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-board"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
e2e = ["playwright>=1.45", "pytest-playwright>=0.5"]

[project.scripts]
local-board = "local_board.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=local_board --cov-report=term-missing --cov-fail-under=75"
markers = ["browser: requires Playwright and an installed Chromium browser"]

[tool.coverage.run]
branch = true
source = ["local_board"]
description = "Repository-local issue tracker with MCP and a lightweight web UI"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.package-data]
local_board = ["static/*"]

