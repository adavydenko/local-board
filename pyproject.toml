[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-board"
version = "0.1.0"
description = "Repository-local issue tracker with MCP and a lightweight web UI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
local-board = "local_board.cli:main"

[tool.setuptools.package-data]
local_board = ["static/*", "templates/*"]
