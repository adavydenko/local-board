name: Test suite

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install .

      # Browser automation is not part of this unittest tree. This discovery
      # command runs every current unit, integration, HTTP/e2e, concurrency,
      # and root test and automatically includes future non-browser tests.
      - name: Run non-browser test suite
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q local_board tests
