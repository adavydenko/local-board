name: Test suite

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install . coverage

      # Browser automation is not part of this unittest tree. This discovery
      # command runs every current unit, integration, HTTP/e2e, concurrency,
      # and root test and automatically includes future non-browser tests.
      # coverage is a CI-only dev tool; the package itself stays dependency-free.
      - name: Run non-browser test suite under coverage
        run: python -m coverage run --branch --source=local_board -m unittest discover -s tests -v

      # Ratchet: raise the threshold as gaps close. cli.py is exercised through
      # subprocess tests, which this in-process measurement undercounts.
      - name: Enforce coverage floor
        run: |
          python -m coverage report -m --skip-empty
          python -m coverage report --fail-under=75

      - name: Compile Python sources
        run: python -m compileall -q local_board tests
