name: Browser E2E (optional)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Playwright Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install browser test package
        run: python -m pip install -e '.[browser-test]'
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Run browser E2E
        run: python -m unittest tests.e2e.test_browser -v
